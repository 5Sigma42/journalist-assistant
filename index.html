<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-dp1K/Iloyvc6pNZ0j+A67ePn0o4rWFvaxfjkDJ/aCaE='; form-action https://sigma5.app.n8n.cloud; base-uri 'none'">
<title>Anmeldung – Journalist Assistant</title>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#14232b;--mut:#5b6b73;--line:#d5dde0;--acc:#0f5f66;--bad:#a02828;--badb:#fbe4e4;--mid:#8a5a00;--midb:#fbf0d9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1e;--card:#16262c;--ink:#e6eef0;--mut:#9fb0b7;--line:#2c4048;--acc:#5fc2c9;--bad:#f08a8a;--badb:#3d1b1b;--mid:#e8b95a;--midb:#3a2e12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;margin:.3em 0 .1em}
.sub{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;max-width:640px;margin-top:8px}
.err{background:var(--badb);color:var(--bad);border-left:4px solid var(--bad);padding:10px 14px;border-radius:4px;margin:12px 0;max-width:640px}
.note{background:var(--midb);color:var(--mid);border-left:4px solid var(--mid);padding:10px 14px;border-radius:4px;margin:12px 0;max-width:640px}
label{display:block;font-weight:600;margin:14px 0 4px}
label:first-child{margin-top:0}
input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
input:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:inline-block;background:var(--acc);color:var(--bg);padding:10px 18px;border:0;border-radius:5px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
.btn.busy{opacity:.65;cursor:progress}
.btn.busy::before{content:"";display:inline-block;width:1em;height:1em;margin-right:.55em;vertical-align:-.15em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.busy::before{animation-duration:3s}}
.foot{color:var(--mut);font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Anmeldung</h1>
<div class="sub">Journalist Assistant</div>
<div class="err" id="m1" hidden>Anmeldung nicht möglich. Bitte Zugang und Passwort prüfen.</div>
<div class="err" id="m2" hidden>Zu viele Fehlversuche. Bitte in 15 Minuten erneut versuchen.</div>
<div class="note" id="m3" hidden>Bitte melden Sie sich an.</div>
<div class="card">
<form method="post" action="https://sigma5.app.n8n.cloud/webhook/partner-portal">
<input type="hidden" name="a" value="login">
<label for="k">Zugang</label>
<input id="k" name="k" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
<label for="pw">Passwort</label>
<input id="pw" name="password" type="password" autocomplete="current-password" required>
<button class="btn" type="submit" data-busy="Anmeldung läuft …">Anmelden</button>
</form>
</div>
<div class="foot">Journalist Assistant – Testversion (Prototyp), keine Gewähr. Bitte keine personenbezogenen Daten eingeben.</div>
</main>
<script>(function(){var q=new URLSearchParams(location.search);var k=(q.get('k')||'').toLowerCase();var f=document.getElementById('k');if(/^[a-z0-9-]{3,40}$/.test(k)){f.value=k;document.getElementById('pw').focus();}else{f.focus();}var m={'1':'m1','2':'m2','3':'m3'}[q.get('e')||''];if(m){document.getElementById(m).hidden=false;}document.addEventListener('submit',function(e){var b=e.target.querySelector('button[type=submit]');if(!b||b.disabled)return;b.setAttribute('data-label',b.textContent);b.textContent=b.getAttribute('data-busy')||b.textContent;b.classList.add('busy');setTimeout(function(){b.disabled=true;},0);});window.addEventListener('pageshow',function(e){if(!e.persisted)return;var l=document.querySelectorAll('button.busy');for(var i=0;i<l.length;i++){l[i].disabled=false;l[i].classList.remove('busy');l[i].textContent=l[i].getAttribute('data-label')||l[i].textContent;}});})();</script>
</body>
</html>
